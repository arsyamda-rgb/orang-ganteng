
name: Build VeyrionRoleplay

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: VeyrionRoleplay/pom.xml

      - name: Build plugin
        working-directory: ./VeyrionRoleplay
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VeyrionRoleplay
          path: VeyrionRoleplay/target/*.jar
